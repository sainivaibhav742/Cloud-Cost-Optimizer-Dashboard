version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - db-data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/cloud_cost_db.db
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here-change-in-production}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ENABLE_DEMO_MODE=true
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
